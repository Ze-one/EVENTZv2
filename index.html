<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="EVENTZ" />
    <meta name="theme-color" content="#0b1f4d" />
    <meta name="description" content="EVENTZ - manage your event access by ETS.NTECH" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/webp" href="/assets/eventz-official-logo.webp" />
    <link rel="apple-touch-icon" href="/assets/eventz-official-logo.webp" />
    <title>EVENTZ</title>
    <style>
      .eventz-boot{min-height:100vh;background:#020617;color:white;display:flex;align-items:center;justify-content:center;font-family:Inter,Arial,sans-serif}.eventz-boot-card{text-align:center;animation:eventz-hide .65s ease-out forwards}.eventz-boot-logo{width:240px;height:72px;border-radius:18px;background:#fff;overflow:hidden;position:relative;box-shadow:0 18px 45px rgba(0,0,0,.28)}.eventz-boot-logo img{position:absolute;width:100%;height:auto;left:0;top:-34%}.eventz-boot-msg{margin-top:10px;font-size:11px;color:#94a3b8;font-weight:700}@keyframes eventz-hide{0%,70%{opacity:1}100%{opacity:.25}}
    </style>
  </head>
  <body>
    <div id="root"><div class="eventz-boot"><div class="eventz-boot-card"><div class="eventz-boot-logo"><img src="/assets/eventz-official-logo.webp" alt="EVENTZ" /></div><div class="eventz-boot-msg">Opening EVENTZ...</div></div></div></div>
    <script>
      (function () {
        var originalOpen = window.open;
        function cleanWhatsAppUrl(url) {
          try {
            var parsed = new URL(String(url), window.location.origin);
            if (!/wa\.me$|whatsapp\.com$/i.test(parsed.hostname)) return url;
            var text = parsed.searchParams.get('text');
            if (!text) return url;
            var cleaned = text
              .replace(/Please present this pass ID or QR verification link at the entrance:\s*/i, 'Please present this pass message or the attached/shared pass at the entrance for verification.\n')
              .replace(/https?:\/\/[^\s]+\/verify\/[^\s]+/gi, '')
              .replace(/\n{3,}/g, '\n\n')
              .trim();
            parsed.searchParams.set('text', cleaned);
            return parsed.toString();
          } catch (error) {
            return url;
          }
        }
        window.open = function (url, target, features) {
          return originalOpen.call(window, cleanWhatsAppUrl(url), target, features);
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
